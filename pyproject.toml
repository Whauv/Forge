[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai-fde"
version = "0.1.0"
description = "AI Forward Deployed Engineer backend built with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "supabase",
    "qdrant-client",
    "google-generativeai",
    "langgraph",
    "langchain",
    "e2b-code-interpreter",
    "PyGithub",
    "firecrawl-py",
    "python-dotenv",
    "httpx",
    "patch",
]

[tool.setuptools.packages.find]
include = ["app*"]
